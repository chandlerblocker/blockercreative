  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      rgb(250, 250, 250);
      --text:    rgba(0, 0, 0, 0.64);
      --heading: rgb(51, 51, 51);
      --white:   rgb(255, 255, 255);
      --font-nav:   'Bebas Neue', sans-serif;
      --font-hero:  'Barlow', sans-serif;
      --font-mono:  'Cutive Mono', monospace;
      --font-title: 'Josefin Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 13px; line-height: 26px; }
    img  { display: block; }
    a    { text-decoration: none; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 48px;
      background: var(--bg);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .nav-logo img { height: 88px; width: auto; }
    .nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
    .nav-links a.nav-text {
      font-family: var(--font-nav); font-size: 16px; letter-spacing: 0.1em;
      color: var(--heading); text-transform: uppercase; transition: opacity 0.2s;
    }
    .nav-links a.nav-text:hover { opacity: 0.5; }
    .nav-instagram { display: flex; align-items: center; color: var(--heading); transition: opacity 0.2s; }
    .nav-instagram:hover { opacity: 0.5; }
    .nav-instagram svg { width: 19px; height: 19px; }

    /* HERO */
    @keyframes heroShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero {
      height: auto;
      padding-top: 160px;
      padding-bottom: 60px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgb(250,250,250) 0%, rgb(242,242,240) 40%, rgb(248,248,246) 70%, rgb(250,250,250) 100%);
      background-size: 300% 300%;
      animation: heroShift 14s ease infinite;
    }
    .hero-text { text-align: center; padding: 0 48px; max-width: 860px; }
    .hero-text h1 {
      font-family: var(--font-hero); font-size: 48px; font-weight: 600;
      color: var(--heading); text-transform: uppercase; letter-spacing: 0.03em; line-height: 1.35;
    }

    /* PORTFOLIO GRID — home page */
    .portfolio-grid { display: block; }
    .portfolio-pair { display: flex; width: 100%; }
    .portfolio-tile { position: relative; overflow: hidden; display: block; cursor: pointer; flex-shrink: 0; }
    .portfolio-tile.tile-full  { width: 100%; }
    .portfolio-tile.tile-full  img { width: 100%; height: 62vh; object-fit: cover; transition: transform 0.6s ease; }
    .portfolio-tile.tile-half  { width: 50%; }
    .portfolio-tile.tile-half  img { width: 100%; height: 44vw; object-fit: cover; transition: transform 0.6s ease; }
    .portfolio-tile:hover img  { transform: scale(1.03); }
    .portfolio-tile-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.38);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.35s ease;
    }
    .portfolio-tile:hover .portfolio-tile-overlay { opacity: 1; }
    .portfolio-tile-title {
      color: var(--white); font-family: var(--font-nav); font-size: 28px;
      letter-spacing: 0.14em; text-transform: uppercase; text-align: center; padding: 0 16px;
    }

    /* PORTFOLIO DETAIL PAGE */
    .portfolio-page { padding-top: 96px; padding-bottom: 80px; }
    .portfolio-page-header { text-align: center; padding: 50px 48px 36px; }
    .portfolio-page-title { font-family: var(--font-nav); font-size: 52px; letter-spacing: 0.12em; color: var(--heading); text-transform: uppercase; margin-bottom: 22px; }
    .portfolio-page-desc  { font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); max-width: 680px; margin: 0 auto; }
    .portfolio-awards { max-width: 680px; margin: 24px auto 0; font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); }
    .portfolio-awards-label { font-family: var(--font-nav); font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--heading); margin-bottom: 4px; }
    .case-steps { max-width: 680px; margin: 28px auto 0; padding: 0 48px; text-align: left; }
    .case-step-label { font-family: var(--font-nav); font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--heading); margin-bottom: 4px; margin-top: 18px; }
    .case-step-text  { font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); }

    /* VIMEO EMBEDS */
    .vimeo-embed { width: 100%; margin-bottom: 4px; }
    .vimeo-embed iframe { width: 100%; height: 56.25vw; max-height: 78vh; border: none; display: block; }

    /* GALLERY — all images full width on detail pages */
    .gallery-row-full { margin-top: 4px; }
    .gallery-row-full img { width: 100%; height: auto; display: block; }

    /* GALLERY — side-by-side pair (Reese's / Suave custom layouts) */
    .gallery-row-pair { display: flex; width: 100%; margin-top: 4px; }
    .gallery-row-pair img { width: 50%; height: 44vw; object-fit: cover; display: block; }

    /* SUBSECTIONS (Social Content) */
    .subsection-wrap { padding: 32px 48px 0; max-width: 780px; margin: 0 auto; text-align: center; }
    .subsection-title { font-family: var(--font-nav); font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--heading); margin-bottom: 8px; }
    .subsection-desc  { font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); }

    /* PROJECT NAV */
    .project-nav { display: flex; justify-content: space-between; align-items: center; padding: 40px 48px; border-top: 1px solid rgba(0,0,0,0.09); margin-top: 48px; }
    .project-nav a { font-family: var(--font-nav); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--heading); transition: opacity 0.2s; }
    .project-nav a:hover { opacity: 0.5; }
    .nav-spacer { min-width: 80px; }

    /* ABOUT PAGE */
    .about-page  { padding: 160px 48px 80px; max-width: 840px; margin: 0 auto; }
    .about-h1    { font-family: var(--font-title); font-size: 80px; font-weight: 300; letter-spacing: -0.02em; color: var(--heading); margin-bottom: 30px; line-height: 1; }
    .about-intro { font-family: var(--font-hero); font-size: 19px; font-weight: 300; line-height: 1.65; color: var(--text); margin-bottom: 44px; }
    .faq-q { font-family: var(--font-nav); font-size: 23px; letter-spacing: 0.06em; color: var(--heading); text-transform: uppercase; margin-bottom: 6px; }
    .faq-a { font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); margin-bottom: 28px; }
    .faq-a a { color: var(--heading); }
    .about-exp { margin-top: 52px; padding-top: 32px; border-top: 1px solid rgba(0,0,0,0.09); }
    .about-exp-label { font-family: var(--font-nav); font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--heading); margin-bottom: 18px; }
    /* Three-column grid: title | company + location | years */
    .exp-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 2px 32px; }
    .exp-line { font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); display: contents; }
    .exp-line span.exp-title    { font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); }
    .exp-line span.exp-location { font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); }
    .exp-line span.exp-years    { font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); white-space: nowrap; }
    .exp-edu  { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.06); font-family: var(--font-mono); font-size: 13px; line-height: 26px; color: var(--text); }

    /* FOOTER */
    #site-footer { text-align: center; padding: 36px 48px; font-family: var(--font-mono); font-size: 11px; color: var(--text); border-top: 1px solid rgba(0,0,0,0.07); }

    /* MOBILE */
    @media (max-width: 768px) {
      nav { padding: 16px 24px; }
      .nav-links { gap: 20px; }
      .hero-text h1 { font-size: 28px; }
      .portfolio-tile.tile-full  img { height: 50vw; }
      .portfolio-tile.tile-half  img { height: 50vw; }
      .portfolio-tile-title { font-size: 18px; }
      .portfolio-page-header { padding: 40px 24px 24px; }
      .portfolio-page-title  { font-size: 36px; }
      .project-nav { padding: 28px 24px; flex-wrap: wrap; gap: 12px; }
      .about-page  { padding: 100px 24px 60px; }
      .about-h1    { font-size: 52px; }
      .about-intro { font-size: 16px; }
      .subsection-wrap { padding: 24px 24px 0; }
    }
  </style>
</head>

    // ── ROUTER ────────────────────────────────────────────────────────────────
    function getRoute() {
      var h = window.location.hash.slice(1);
      return h || '/';
    }
    window.addEventListener('hashchange', render);
    window.addEventListener('load', render);

    function render() {
      var route = getRoute();
      var app = document.getElementById('app');
      window.scrollTo(0, 0);
      if (route === '/' || route === '') {
        app.innerHTML = renderHome();
      } else if (route === '/contact') {
        app.innerHTML = renderAbout();
      } else {
        var id = route.replace(/^\//, '').replace(/\/bpc$/, '');
        var project = null;
        for (var i = 0; i < PROJECTS.length; i++) {
          if (PROJECTS[i].id === id) { project = PROJECTS[i]; break; }
        }
        if (project) {
          app.innerHTML = renderProject(project);
        } else {
          app.innerHTML = '<div style="padding:200px 48px;text-align:center;font-family:var(--font-mono);">Page not found.</div>';
        }
      }
    }

    // ── RENDERERS ─────────────────────────────────────────────────────────────

    function tile(p, sizeClass) {
      return '<a href="#/' + p.id + '" class="portfolio-tile ' + sizeClass + '">'
        + '<img src="' + p.thumbnail + '" alt="' + p.title + '" loading="lazy">'
        + '<div class="portfolio-tile-overlay"><span class="portfolio-tile-title">' + p.title + '</span></div>'
        + '</a>';
    }

    function renderHome() {
      var grid = '';
      var i = 0, turn = 0;
      while (i < PROJECTS.length) {
        if (turn === 0) {
          grid += tile(PROJECTS[i], 'tile-full');
          i++; turn = 1;
        } else {
          var a = PROJECTS[i], b = PROJECTS[i + 1];
          if (b) {
            grid += '<div class="portfolio-pair">' + tile(a, 'tile-half') + tile(b, 'tile-half') + '</div>';
            i += 2;
          } else {
            grid += tile(a, 'tile-full');
            i++;
          }
          turn = 0;
        }
      }
      return '<section class="hero"><div class="hero-text"><h1>Chandler Blocker is an Associate Creative Director based in Dallas, TX</h1></div></section>'
           + '<section class="portfolio-grid">' + grid + '</section>';
    }

    function renderAbout() {
      return '<div class="about-page">'
        + ''
        + '<a href="mailto:chandler@blockercreative.com" style="font-family:var(--font-hero);font-size:48px;font-weight:600;color:var(--heading);text-transform:uppercase;letter-spacing:0.03em;line-height:1.35;display:block;margin-bottom:52px;">chandler@blockercreative.com</a>'
        + '<div class="about-exp">'
        + '<div class="about-exp-label">Experience</div>'
        + '<div class="exp-grid">'
        + '<span class="exp-title">Founder &amp; Creative Director</span><span class="exp-location">Blocker Creative, Dallas</span><span class="exp-years">2020 &ndash; Present</span>'
        + '<span class="exp-title">Associate Creative Director</span><span class="exp-location">RP3 Agency, DC</span><span class="exp-years">2021 &ndash; 2023</span>'
        + '<span class="exp-title">Sr. Art Director</span><span class="exp-location">RP3 Agency, DC</span><span class="exp-years">2019 &ndash; 2021</span>'
        + '<span class="exp-title">Art Director</span><span class="exp-location">RP3 Agency, DC</span><span class="exp-years">2018 &ndash; 2019</span>'
        + '<span class="exp-title">Art Director</span><span class="exp-location">Carrot, New York</span><span class="exp-years">2017 &ndash; 2018</span>'
        + '<span class="exp-title">Jr. Art Director</span><span class="exp-location">Carrot, New York</span><span class="exp-years">2016 &ndash; 2017</span>'
        + '<span class="exp-title">Jr. Art Director</span><span class="exp-location">Arnold, New York</span><span class="exp-years">2015 &ndash; 2016</span>'
        + '<span class="exp-title">Art Director Intern</span><span class="exp-location">Arnold, New York</span><span class="exp-years">Summer 2015</span>'
        + '</div>'
        + '<div class="exp-edu">B.A. Creative Advertising,Southern Methodist University,Dallas</div>'
        + '</div></div>';
    }

    function renderProject(p) {
      var idx  = -1;
      for (var k = 0; k < PROJECTS.length; k++) { if (PROJECTS[k].id === p.id) { idx = k; break; } }
      var prev = idx > 0 ? PROJECTS[idx - 1] : null;
      var next = idx < PROJECTS.length - 1 ? PROJECTS[idx + 1] : null;

      // Awards
      var awardsHTML = '';
      if (p.awards && p.awards.length) {
        awardsHTML = '<div class="portfolio-awards"><div class="portfolio-awards-label">Awards</div>';
        for (var i = 0; i < p.awards.length; i++) awardsHTML += '<div>' + p.awards[i] + '</div>';
        awardsHTML += '</div>';
      }

      // Case steps (Suave)
      var stepsHTML = '';
      if (p.steps) {
        stepsHTML = '<div class="case-steps">';
        for (var i = 0; i < p.steps.length; i++) {
          stepsHTML += '<div class="case-step-label">Step ' + p.steps[i].n + '</div>'
                     + '<div class="case-step-text">' + p.steps[i].text + '</div>';
        }
        stepsHTML += '</div>';
      }

      // Subsections (Social Content)
      var subsHTML = '';
      if (p.subsections) {
        for (var i = 0; i < p.subsections.length; i++) {
          subsHTML += '<div class="subsection-wrap">'
                    + '<div class="subsection-title">' + p.subsections[i].title + '</div>'
                    + '<div class="subsection-desc">' + p.subsections[i].desc + '</div>'
                    + '</div>';
        }
      }

      // Videos
      var videosHTML = '';
      for (var i = 0; i < p.videos.length; i++) {
        videosHTML += '<div class="vimeo-embed">'
          + '<iframe src="https://player.vimeo.com/video/' + p.videos[i] + '?title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>'
          + '</div>';
      }

      // Images — galleryLayout override or default (all full width)
      var imgsHTML = '';
      if (p.images.length) {
        var layout = p.galleryLayout || p.images.map(function(_, i) { return i; });
        for (var i = 0; i < layout.length; i++) {
          var row = layout[i];
          if (Array.isArray(row)) {
            imgsHTML += '<div class="gallery-row-pair">'
              + '<img src="' + p.images[row[0]] + '" alt="' + p.title + '" loading="lazy">'
              + '<img src="' + p.images[row[1]] + '" alt="' + p.title + '" loading="lazy">'
              + '</div>';
          } else {
            imgsHTML += '<div class="gallery-row-full"><img src="' + p.images[row] + '" alt="' + p.title + '" loading="lazy"></div>';
          }
        }
      }

      // Prev/Next nav
      var navHTML = '<div class="project-nav">'
        + (prev ? '<a href="#/' + prev.id + '">&larr; ' + prev.title + '</a>' : '<span class="nav-spacer"></span>')
        + '<a href="#/">All Work</a>'
        + (next ? '<a href="#/' + next.id + '">' + next.title + ' &rarr;</a>' : '<span class="nav-spacer"></span>')
        + '</div>';

      return '<div class="portfolio-page">'
        + '<div class="portfolio-page-header">'
        + '<div class="portfolio-page-title">' + p.title + '</div>'
        + '<div class="portfolio-page-desc">' + p.description + '</div>'
        + awardsHTML + stepsHTML
        + '</div>'
        + subsHTML
        + videosHTML
        + imgsHTML
        + navHTML
        + '</div>';
    }

  </script>
